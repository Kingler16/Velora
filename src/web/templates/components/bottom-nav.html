<div class="bottom-more-backdrop" onclick="document.body.classList.remove('bottom-more-open'); document.getElementById('bottom-more-sheet').classList.remove('open'); var b=document.querySelector('.bottom-nav-more'); if(b) b.setAttribute('aria-expanded','false');"></div>

<div class="sidebar-backdrop" onclick="document.body.classList.remove('sidebar-open'); var s=document.querySelector('.sidebar'); if(s) s.classList.remove('open');"></div>

<style>
/* Empfehlungs-Badge — Akzentfarbe, nur sichtbar wenn actionable_count > 0.
   Gilt für Bottom-Nav (mobil) und Desktop-Sidebar. */
.nav-badge {
    position: absolute;
    top: 2px;
    left: 50%;
    margin-left: 6px;
    min-width: 16px;
    height: 16px;
    padding: 0 4px;
    border-radius: 8px;
    background: var(--accent);
    color: #04121a;
    font-size: 10px;
    font-weight: 700;
    line-height: 16px;
    text-align: center;
    box-shadow: 0 0 8px rgba(34, 211, 238, 0.5);
    pointer-events: none;
}
/* Desktop-Sidebar (a ist bereits display:flex): Badge ans rechte Ende. */
.sidebar-nav a .nav-badge {
    position: static;
    margin-left: auto;
    align-self: center;
    flex-shrink: 0;
}
</style>
