name: Velora

options:
  bundleIdPrefix: com.example
  developmentLanguage: de
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "26.0"

packages:
  VeloraKit:
    path: VeloraKit

settings:
  base:
    # Team, Bundle-ID und Push kommen aus Config/Base.xcconfig + Config/Local.xcconfig.
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES

targets:
  Velora:
    type: application
    platform: iOS
    sources:
      - Velora
    dependencies:
      - package: VeloraKit
    # Signierung/Push je Nutzer: Velora/Velora.entitlements (APNs) wird nur über
    # CODE_SIGN_ENTITLEMENTS in Config/Local.xcconfig eingebunden.
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Base.xcconfig
    info:
      path: Velora/Info.plist
      properties:
        CFBundleDisplayName: Velora
        # Build-Nummer kommt aus CURRENT_PROJECT_VERSION – TestFlight verlangt bei jedem Upload eine höhere.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        VeloraDefaultServer: $(VELORA_DEFAULT_SERVER)
        ITSAppUsesNonExemptEncryption: false
        # Der Pi spricht nur HTTP (Heimnetz bzw. Tailscale, das selbst verschlüsselt).
        # Bewusst ohne NSAllowsLocalNetworking: ist das gesetzt, ignoriert iOS
        # NSAllowsArbitraryLoads und blockiert HTTP zu *.ts.net-Namen.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSLocalNetworkUsageDescription: Velora verbindet sich im Heim-WLAN direkt mit deinem Velora-Server.
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_BASE)
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
